name: Docker Compose CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-up:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull Docker images
        run: docker compose pull

      - name: Start services with Docker Compose
        run: docker compose up -d

      - name: List running containers
        run: docker ps

      - name: Wait for services to initialize
        run: sleep 30

      - name: Copy dataset to client container
        run: docker cp ev_project/Electric_Vehicle_Population_Data.csv client:/home/hadoop/

      - name: Create HDFS directory
        run: docker exec client hdfs dfs -mkdir -p /data/ev

      - name: Upload dataset to HDFS
        run: docker exec client hdfs dfs -put -f /home/hadoop/Electric_Vehicle_Population_Data.csv /data/ev/

      - name: Run Spark Analysis
        run: |
          docker exec client bash -c "cd /home/hadoop/ev_project && spark-submit \
            --master yarn \
            --deploy-mode cluster \
            analiticas_ev.py"

      - name: Get Cluster Stats and Logs
        run: |
          docker exec client bash -c "
            mkdir -p /home/hadoop/results
            echo '=== YARN Node List ===' > /home/hadoop/results/cluster_report.txt
            yarn node -list -all >> /home/hadoop/results/cluster_report.txt
            
            echo -e '\n=== YARN Applications ===' >> /home/hadoop/results/cluster_report.txt
            yarn application -list -appStates FINISHED >> /home/hadoop/results/cluster_report.txt
            
            # Get the last application ID
            APP_ID=\$(yarn application -list -appStates FINISHED | awk '/application_/ {print \$1}' | tail -n 1)
            
            if [ -n \"\$APP_ID\" ]; then
              echo -e \"\n=== Status for \$APP_ID ===\" >> /home/hadoop/results/cluster_report.txt
              yarn application -status \$APP_ID >> /home/hadoop/results/cluster_report.txt
              
              echo -e \"\n=== Logs for \$APP_ID ===\" >> /home/hadoop/results/cluster_report.txt
              yarn logs -applicationId \$APP_ID >> /home/hadoop/results/cluster_report.txt 2>&1 || echo 'Logs not available (aggregation might be disabled)' >> /home/hadoop/results/cluster_report.txt
            else
              echo -e \"\nNo finished applications found.\" >> /home/hadoop/results/cluster_report.txt
            fi
          "

      - name: Extract results from HDFS
        run: |
          docker exec client hdfs dfs -get /results/ev /home/hadoop/results

      - name: Copy results to host
        run: |
          mkdir -p results
          docker cp client:/home/hadoop/results ./results

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Commit and push results
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add results/
          git commit -m "Add analysis results and plots" || echo "No changes to commit"
          git push

      - name: Stop services
        if: always()
        run: docker compose down
