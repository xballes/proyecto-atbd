name: Docker Compose CI

on:
  workflow_dispatch:        
  push:
    branches:
      - main               
    paths:
      - .github/workflows/main.yml

permissions:
  contents: write

jobs:
  build-and-up:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull Docker images
        run: docker compose pull

      - name: Start services with Docker Compose
        run: docker compose up -d

      - name: List running containers
        run: docker ps

      - name: Wait for services to initialize
        run: sleep 30

      # ============================
      # VALIDACIÓN ANTES DE SPARK
      # ============================

      - name: Clean previous ALL results (validation step)
        run: |
          rm -rf results

      - name: Set up Python for validation
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas "great_expectations==0.15.50"

      - name: Run data validation BEFORE Spark
        run: |
          cd ev_project
          python validacion_datos.py

      # ============================
      # HDFS & SPARK
      # ============================

      - name: Copy dataset to client container
        run: docker cp ev_project/Electric_Vehicle_Population_Data.csv client:/home/hadoop/

      - name: Create HDFS directory
        run: docker exec client hdfs dfs -mkdir -p /data/ev

      - name: Upload dataset to HDFS
        run: docker exec client hdfs dfs -put -f /home/hadoop/Electric_Vehicle_Population_Data.csv /data/ev/

      - name: Clean previous HDFS Spark results
        run: |
          docker exec client hdfs dfs -rm -r -skipTrash /results/ev || echo "No previous HDFS ev results."

      - name: Run Spark Analysis
        run: |
          docker exec client bash -c "cd /home/hadoop/ev_project && spark-submit \
            --master yarn \
            --deploy-mode cluster \
            analiticas_ev.py"

      - name: Get Cluster Stats and Logs
        run: |
          docker exec client bash -c "
            mkdir -p /home/hadoop/results
            echo '=== YARN Node List ===' > /home/hadoop/results/cluster_report.txt
            yarn node -list -all >> /home/hadoop/results/cluster_report.txt

            echo -e '\n=== YARN Applications ===' >> /home/hadoop/results/cluster_report.txt
            yarn application -list -appStates FINISHED >> /home/hadoop/results/cluster_report.txt

            APP_ID=\$(yarn application -list -appStates FINISHED | awk '/application_/ {print \$1}' | tail -n 1)

            if [ -n \"\$APP_ID\" ]; then
              echo -e \"\n=== Status for \$APP_ID ===\" >> /home/hadoop/results/cluster_report.txt
              yarn application -status \$APP_ID >> /home/hadoop/results/cluster_report.txt

              echo -e \"\n=== Logs for \$APP_ID ===\" >> /home/hadoop/results/cluster_report.txt
              yarn logs -applicationId \$APP_ID >> /home/hadoop/results/cluster_report.txt 2>&1 || echo 'Logs not available.' >> /home/hadoop/results/cluster_report.txt
            else
              echo -e \"\nNo finished applications found.\" >> /home/hadoop/results/cluster_report.txt
            fi
          "

      - name: Get containers per worker (workers_used.txt)
        run: |
          docker exec client bash -c '
            APP_ID=$(yarn application -list -appStates FINISHED | awk "/application_/ {print \$1}" | tail -n 1)
            echo "Detected APP_ID: $APP_ID"

            mkdir -p /home/hadoop/results

            {
              echo "Application: $APP_ID"
              echo
              echo "=== Containers for this application (check Node-Id column) ==="
              yarn container -list -appId "$APP_ID"
            } > /home/hadoop/results/workers_used.txt 2>&1
          '
          
      - name: Extract Spark results from HDFS
        run: |
          docker exec client hdfs dfs -get /results/ev /home/hadoop/results

      - name: Clean previous Spark results (only ev and cluster logs)
        run: |
          rm -rf results/ev results/cluster_report.txt || true

      - name: Copy Spark results to host
        run: |
          docker cp client:/home/hadoop/results ./

      - name: Capture YARN app screenshot with Playwright
        run: |
          APP_ID=$(docker exec client yarn application -list -appStates FINISHED | awk '/application_/ {print $1}' | tail -n 1)
          echo "Detected APP_ID: $APP_ID"
  
          # Instalar Node y Playwright
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
  
          mkdir -p results/yarn_ui
  
          node << 'EOF'
          const { chromium } = require('playwright');
  
          (async () => {
            const appId = process.env.APP_ID;
            const url = `http://localhost:8088/cluster/app/${appId}`;
  
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto(url, { waitUntil: 'networkidle' });
            await page.setViewportSize({ width: 1280, height: 720 });
            await page.screenshot({
              path: `results/yarn_ui/app_${appId}.png`,
              fullPage: true
            });
            await browser.close();
          })();
          EOF
        env:
          APP_ID: ${{ steps.get-app-id.outputs.app_id }}

      # ============================
      # VISUALIZACIÓN
      # ============================

      - name: Set up Python (for visualization)
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install visualization dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas seaborn matplotlib plotly pyarrow
          pip install --upgrade kaleido

      - name: Clean previous visualization results (only plots)
        run: |
          rm -rf results/plots || true

      - name: Run visualization script
        run: |
          cd ev_project
          python visualizacion.py

      # ============================
      # COMMIT RESULTADOS
      # ============================

      - name: Commit and push results
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add results/
          git commit -m "Add analysis results" || echo "No changes to commit"
          git push

      - name: Stop services
        if: always()
        run: docker compose down
